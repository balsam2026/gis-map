<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق خرائط الأحداثيات والمساحة الهندسي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-primary: #121826;
            --bg-surface: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar Styling */
        .top-bar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-field {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-field label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="number"], select {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            width: 110px;
            font-size: 0.9rem;
            outline: none;
        }

        select {
            width: 80px;
            cursor: pointer;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--accent-color);
        }

        .system-toggle {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
            display: flex;
            gap: 2px;
        }

        .system-toggle button {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .system-toggle button.active {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        button.btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        /* Main Workspace Area */
        .workspace {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
            background-color: #050b14;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 340px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .stats-panel {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .stat-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .stat-card:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .points-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .points-list-header {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .points-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .point-item {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .point-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .point-index {
            color: var(--accent-color);
            font-weight: 700;
        }

        .utm-subtext {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-delete-point {
            background: transparent;
            color: var(--danger-color);
            padding: 4px 8px;
            font-size: 1rem;
        }

        .btn-delete-point:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }

        /* Responsive Layout Improvements */
        @media (max-width: 768px) {
            .workspace {
                flex-direction: column-reverse;
            }

            .sidebar {
                width: 100%;
                height: 40%;
                border-right: none;
                border-top: 1px solid var(--border-color);
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group, .btn-group {
                justify-content: space-between;
            }

            input[type="number"] {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="input-group">
            <div class="system-toggle">
                <button id="modeWgsBtn" class="active">WGS84</button>
                <button id="modeUtmBtn">UTM</button>
            </div>

            <div id="wgsInputs" style="display: flex; gap: 8px; align-items: center;">
                <div class="input-field">
                    <label for="latInput">عرض:</label>
                    <input type="number" id="latInput" step="any" placeholder="32.0000">
                </div>
                <div class="input-field">
                    <label for="lngInput">طول:</label>
                    <input type="number" id="lngInput" step="any" placeholder="44.0000">
                </div>
            </div>

            <div id="utmInputs" style="display: none; gap: 8px; align-items: center;">
                <div class="input-field">
                    <label for="eastingInput">E:</label>
                    <input type="number" id="eastingInput" step="any" placeholder="436880">
                </div>
                <div class="input-field">
                    <label for="northingInput">N:</label>
                    <input type="number" id="northingInput" step="any" placeholder="3540000">
                </div>
                <div class="input-field">
                    <label for="zoneInput">Zone:</label>
                    <input type="number" id="zoneInput" min="1" max="60" placeholder="38" value="38">
                </div>
                <div class="input-field">
                    <label for="hemiInput">نصف:</label>
                    <select id="hemiInput">
                        <option value="N">شمالي</option>
                        <option value="S">جنوبي</option>
                    </select>
                </div>
            </div>

            <button id="addPointBtn">إضافة نقطة</button>
        </div>

        <div class="btn-group">
            <button id="exportBtn">تصدير صورة PNG</button>
            <button id="resetBtn" class="btn-danger">تصفير الكل</button>
        </div>
    </header>

    <main class="workspace">
        <aside class="sidebar">
            <section class="stats-panel">
                <div class="stat-card">
                    <div class="stat-label">المسافة الإجمالية (كيلومتر)</div>
                    <div class="stat-value" id="distKm">0.000 km</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">المسافة الإجمالية (متر)</div>
                    <div class="stat-value" id="distM">0.00 m</div>
                </div>
            </section>

            <section class="points-list-container">
                <div class="points-list-header">الإحداثيات المحددة (<span id="pointCount">0</span>)</div>
                <ul class="points-list" id="pointsList"></ul>
            </section>
        </aside>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // Default configuration values
        const DEFAULT_LAT = 31.9961;
        const DEFAULT_LNG = 44.3311;
        const DEFAULT_ZOOM = 13;
        const MIN_ZOOM = 3;
        const MAX_ZOOM = 19;
        const EARTH_RADIUS_METERS = 6371000;

        // Central State Management Matrix
        let appState = {
            points: [],       // Array of {lat, lng} objects
            markers: [],      // Array of Leaflet marker instances
            polyline: null,   // Leaflet polyline instance
            inputMode: 'WGS'  // Current input system mode: 'WGS' or 'UTM'
        };

        // Initialize Map Control
        const map = L.map('map', {
            minZoom: MIN_ZOOM,
            maxZoom: MAX_ZOOM
        }).setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);

        // Add Satellite Tile Layer
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: MAX_ZOOM
        }).addTo(map);

        // Helper Functions for UTM Conversion using proj4
        function convertWGS84ToUTM(lat, lng) {
            const zone = Math.floor((lng + 180) / 6) + 1;
            const hemisphere = lat >= 0 ? 'N' : 'S';
            const utmProjStr = `+proj=utm +zone=${zone} ${hemisphere === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;
            const [easting, northing] = proj4('EPSG:4326', utmProjStr, [lng, lat]);
            return {
                easting: easting,
                northing: northing,
                zone: zone,
                hemisphere: hemisphere
            };
        }

        function convertUTMToWGS84(easting, northing, zone, hemisphere) {
            const utmProjStr = `+proj=utm +zone=${zone} ${hemisphere === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;
            const [lng, lat] = proj4(utmProjStr, 'EPSG:4326', [easting, northing]);
            return { lat: lat, lng: lng };
        }

        // Calculate distance using Haversine Formula
        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const toRad = (angle) => (angle * Math.PI) / 180;
            
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            
            const rLat1 = toRad(lat1);
            const rLat2 = toRad(lat2);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(rLat1) * Math.cos(rLat2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            
            return EARTH_RADIUS_METERS * c;
        }

        // Calculate total distance along all collected points
        function calculateTotalDistance() {
            let totalMeters = 0;
            for (let i = 0; i < appState.points.length - 1; i++) {
                const p1 = appState.points[i];
                const p2 = appState.points[i + 1];
                totalMeters += calculateHaversineDistance(p1.lat, p1.lng, p2.lat, p2.lng);
            }
            return totalMeters;
        }

        // Prevent adding duplicate consecutive points (E.g. double click trigger)
        function isDuplicatePoint(newLat, newLng) {
            if (appState.points.length === 0) return false;
            const lastPoint = appState.points[appState.points.length - 1];
            const threshold = 0.000001; // Precision tolerance for duplicate detection
            return Math.abs(lastPoint.lat - newLat) < threshold && Math.abs(lastPoint.lng - newLng) < threshold;
        }

        // Centralized State Update and UI Rendering
        function updateStateAndUI() {
            // Remove existing markers from map
            appState.markers.forEach(marker => map.removeLayer(marker));
            appState.markers = [];

            // Remove existing polyline from map
            if (appState.polyline) {
                map.removeLayer(appState.polyline);
                appState.polyline = null;
            }

            // Draw Markers
            appState.points.forEach((pt, idx) => {
                const utm = convertWGS84ToUTM(pt.lat, pt.lng);
                const marker = L.marker([pt.lat, pt.lng]).addTo(map);
                marker.bindPopup(`
                    <b>نقطة ${idx + 1}</b><br>
                    <b>WGS84:</b> ${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}<br>
                    <b>UTM:</b> Z${utm.zone}${utm.hemisphere} E:${utm.easting.toFixed(1)} N:${utm.northing.toFixed(1)}
                `);
                appState.markers.push(marker);
            });

            // Draw Vector Polyline
            if (appState.points.length > 1) {
                const latLngArray = appState.points.map(p => [p.lat, p.lng]);
                appState.polyline = L.polyline(latLngArray, {
                    color: '#38bdf8',
                    weight: 4,
                    opacity: 0.8
                }).addTo(map);
            }

            // Calculate Metrics
            const totalMeters = calculateTotalDistance();
            const totalKm = totalMeters / 1000;

            // Render Metrics
            document.getElementById('distM').textContent = totalMeters.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m';
            document.getElementById('distKm').textContent = totalKm.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' km';
            document.getElementById('pointCount').textContent = appState.points.length;

            // Render Points List
            const listElement = document.getElementById('pointsList');
            listElement.innerHTML = '';
            
            appState.points.forEach((pt, idx) => {
                const utm = convertWGS84ToUTM(pt.lat, pt.lng);
                const li = document.createElement('li');
                li.className = 'point-item';
                li.innerHTML = `
                    <div class="point-info">
                        <span class="point-index">نقطة ${idx + 1}</span>
                        <span><b>LL:</b> ${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}</span>
                        <span class="utm-subtext"><b>UTM:</b> ${utm.zone}${utm.hemisphere} E:${utm.easting.toFixed(0)} N:${utm.northing.toFixed(0)}</span>
                    </div>
                    <button class="btn-delete-point" onclick="removePoint(${idx})" title="حذف النقطة">&times;</button>
                `;
                listElement.appendChild(li);
            });
        }

        // Add point logic
        function addPoint(lat, lng) {
            if (isNaN(lat) || isNaN(lng)) {
                alert('يرجى إدخال قيم إحداثيات صحيحة.');
                return;
            }

            if (isDuplicatePoint(lat, lng)) {
                return; // Suppress duplicate point additions
            }

            appState.points.push({ lat: lat, lng: lng });
            updateStateAndUI();
        }

        // Remove single point by index
        window.removePoint = function(index) {
            appState.points.splice(index, 1);
            updateStateAndUI();
        };

        // Unified Clear All State function
        function resetAllData() {
            appState.points = [];
            updateStateAndUI();
            map.setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
            document.getElementById('latInput').value = '';
            document.getElementById('lngInput').value = '';
            document.getElementById('eastingInput').value = '';
            document.getElementById('northingInput').value = '';
        }

        // Mode Switching UI Handler
        document.getElementById('modeWgsBtn').addEventListener('click', function() {
            appState.inputMode = 'WGS';
            this.classList.add('active');
            document.getElementById('modeUtmBtn').classList.remove('active');
            document.getElementById('wgsInputs').style.display = 'flex';
            document.getElementById('utmInputs').style.display = 'none';
        });

        document.getElementById('modeUtmBtn').addEventListener('click', function() {
            appState.inputMode = 'UTM';
            this.classList.add('active');
            document.getElementById('modeWgsBtn').classList.remove('active');
            document.getElementById('wgsInputs').style.display = 'none';
            document.getElementById('utmInputs').style.display = 'flex';
        });

        // Event Listeners
        map.on('click', function(e) {
            addPoint(e.latlng.lat, e.latlng.lng);
        });

        document.getElementById('addPointBtn').addEventListener('click', function() {
            let lat, lng;

            if (appState.inputMode === 'WGS') {
                lat = parseFloat(document.getElementById('latInput').value);
                lng = parseFloat(document.getElementById('lngInput').value);
            } else {
                const easting = parseFloat(document.getElementById('eastingInput').value);
                const northing = parseFloat(document.getElementById('northingInput').value);
                const zone = parseInt(document.getElementById('zoneInput').value, 10);
                const hemisphere = document.getElementById('hemiInput').value;

                if (isNaN(easting) || isNaN(northing) || isNaN(zone) || zone < 1 || zone > 60) {
                    alert('يرجى إدخال قيم UTM صحيحة (Zone بين 1 و 60).');
                    return;
                }

                try {
                    const converted = convertUTMToWGS84(easting, northing, zone, hemisphere);
                    lat = converted.lat;
                    lng = converted.lng;
                } catch (err) {
                    alert('حدث خطأ أثناء تحويل إحداثيات UTM.');
                    return;
                }
            }

            addPoint(lat, lng);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.panTo([lat, lng]);
            }
        });

        document.getElementById('resetBtn').addEventListener('click', resetAllData);

        // Export map view as PNG snapshot
        document.getElementById('exportBtn').addEventListener('click', function() {
            const mapContainer = document.getElementById('map');
            
            html2canvas(mapContainer, {
                useCORS: true,
                allowTaint: false,
                ignoreElements: (node) => {
                    // Ignore Leaflet zoom control UI during rendering
                    return node.classList.contains('leaflet-control-zoom');
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `map-snapshot-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert('حدث خطأ أثناء التقاط صورة الخريطة.');
                console.error(err);
            });
        });

        // Initial UI Render Initialization
        updateStateAndUI();
    </script>
</body>
</html>
